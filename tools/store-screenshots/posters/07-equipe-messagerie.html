<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Deep Clean — équipe : messagerie</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Côté équipes : même modèle A, fond plus profond (marine → abysse) mais toujours lumineux */
  body {
    background:
      radial-gradient(1000px 820px at 88% 6%, rgba(79, 209, 242, .85), rgba(79, 209, 242, 0) 62%),
      radial-gradient(900px 900px at -5% 30%, rgba(30, 156, 198, .75), rgba(30, 156, 198, 0) 66%),
      linear-gradient(180deg, #0A95C8 0%, #1279BA 20%, #184F91 42%, #1F2C68 64%, #151E52 82%, #0C1233 100%);
  }
  .glow { position: absolute; border-radius: 50%; pointer-events: none;
    background: radial-gradient(closest-side, rgba(79, 209, 242, .55), rgba(79, 209, 242, 0)); }
  .team-badge {
    position: absolute; left: 50%; top: 92px; z-index: 20;
    transform: translateX(-50%) rotate(-2deg);
    display: inline-flex; align-items: center; gap: 22px;
    padding: 20px 40px 20px 22px; border-radius: 999px;
    background: #fff; color: var(--marine);
    font-weight: 900; font-size: 50px; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap;
    box-shadow: 0 22px 50px rgba(12, 18, 51, .35), 0 0 0 10px rgba(79, 209, 242, .38);
  }
  .team-badge .ic { flex: none; width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center;
    background: var(--marine); color: var(--aqua); }
  .team-badge .ic svg { width: 46px; height: 46px; }

  .t7 { top: 286px; }
  .t7 .a { font-size: 168px; }
  .t7 .b { font-size: 196px; }
</style>
</head>
<body>
  <div class="rays"></div>
  <svg class="waves" viewBox="0 0 1290 2796" aria-hidden="true">
    <path data-wave="1990,28,1400,2.0" fill="rgba(79,209,242,.28)"/>
    <path data-wave="2150,30,1050,4.4" fill="rgba(90,156,196,.40)"/>
    <path data-wave="2330,24,1600,1.1" fill="rgba(24,79,145,.80)"/>
  </svg>
  <div class="bubbles" data-seed="88" data-n="26" data-zone="40,880,1250,2400" data-min="12" data-max="62" data-avoid="230,1060,1060,2500;420,1900,1230,2400;40,880,820,1080"></div>
  <div class="bubbles" data-seed="52" data-n="14" data-zone="40,40,1250,880" data-min="8" data-max="34" data-avoid="100,80,1190,760"></div>

  <div class="glow" style="left:70px;top:1000px;width:1150px;height:1150px"></div>
  <svg class="splash" data-seed="4" data-spikes="5" data-color="rgba(255,255,255,.12)" style="left:110px;top:160px;width:1070px;height:1070px"></svg>
  <svg class="splash" data-seed="21" data-spikes="6" data-color="#4FD1F2" style="left:-110px;top:1960px;width:420px;height:420px"></svg>

  <div class="team-badge">
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.6"/><path d="M15.6 14.2c2.9.2 5.4 2.5 5.4 5.8"/></svg></span>
    Espace équipe
  </div>

  <h1 class="title t7">
    <span class="l a">Toute</span>
    <span class="l a">l’équipe</span>
    <span class="l"><span class="hl b">connectée.</span></span>
  </h1>

  <svg class="spark" style="left:1000px;top:296px;width:84px;height:84px"></svg>
  <svg class="spark" style="left:1080px;top:262px;width:40px;height:40px"></svg>
  <svg class="spark" data-color="#4FD1F2" style="left:150px;top:470px;width:62px;height:62px"></svg>

  <div class="phone" style="--w:760px;left:265px;top:1100px;--rot:-4deg">
    <img src="../screens/equipe-messagerie.png" alt="">
  </div>

  <div class="zoom" style="left:440px;top:1940px;--r:5deg" data-zoom="../screens/equipe-statistiques.png|40|480|1210|490|0.62|60"></div>

  <div class="sticker aqua" style="left:74px;top:910px;--r:-4deg">
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5h14a2 2 0 0 1 2 2v8.5a2 2 0 0 1-2 2h-7.5L6.5 21v-4H5a2 2 0 0 1-2-2V6.5a2 2 0 0 1 2-2z"/></svg></span>
    Messagerie d’équipe
  </div>
  <div class="sticker white" style="right:70px;top:2250px;--r:4deg">
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20v-6M12 20V5M19 20v-9"/></svg></span>
    Suivi de l’activité
  </div>

  <svg class="waves" viewBox="0 0 1290 2796" aria-hidden="true" style="z-index:35">
    <path data-wave="2430,26,1300,4.2" fill="rgba(79,209,242,.55)"/>
    <path data-wave="2475,22,1000,2.9" fill="#0C1233"/>
  </svg>
  <div class="bubbles" data-seed="9" data-n="10" data-zone="40,2420,1250,2560" data-min="8" data-max="28" style="z-index:36"></div>
  <div class="signature" style="top:2565px">
    <img src="../brand/logo-embleme.svg" alt="Deep Clean">
    <div class="txt">Le propre, <em>en&nbsp;profondeur.</em></div>
  </div>
  <script src="fx.js"></script>
</body></html>
